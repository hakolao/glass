name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `rustfmt.toml` uses nightly-only options, so formatting is the one thing that needs nightly.
  # Everything else runs on stable, including clippy, so lint results do not shift under us.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt -- --check --color always

  lint:
    name: Clippy & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-rust-lint"
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: cargo doc
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-rust-test"
      # The examples need a GPU and a display, so they are only built here, never run.
      - name: Build
        run: cargo build --all-targets --all-features --locked --verbose
      - name: Test
        run: cargo test --all-features --locked --verbose
